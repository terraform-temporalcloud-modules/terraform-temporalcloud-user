name: Apply Tests

# These tests run against a REAL Temporal Cloud account, so they are deliberately
# not part of the PR gate:
#
#   - forked PRs cannot read secrets, so the job would fail for contributors
#   - they consume account quota and API calls on every run
#
# They create real users. Every generated address sits on example.com, which
# RFC 2606 reserves and which can never receive mail, so no invitation reaches a
# person — but a real pending account member exists for the length of the run and
# holds a real seat. The leftover check below is the backstop for that, which is
# why it runs even when the tests fail. tests/README.md has the detail.
#
# They DO run on main after Pre-Commit passes, because a release must not be
# published from code these tests reject. Release is chained after this
# workflow, so the sequence on a merge is:
#
#   push to main -> Pre-Commit -> Apply Tests -> Release
#
# Any failure in the chain stops the release.
on:
  workflow_run:
    workflows: ['Pre-Commit']
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC.
    - cron: '0 10 * * 1'

# Serialize. Two concurrent runs would compete for the account's quota.
# cancel-in-progress MUST stay false: cancelling mid-apply would abandon any real
# resource a future test creates, with no destroy.
concurrency:
  group: apply-tests
  cancel-in-progress: false

jobs:
  test:
    name: terraform test
    runs-on: ubuntu-latest
    # Never bill the account from a fork, and when chained after Pre-Commit only
    # proceed if that run actually passed.
    if: >-
      github.repository_owner == 'terraform-temporalcloud-modules' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_wrapper: false

      # First real step: prove the API answers and the key is accepted. Without
      # this, a missing, expired or wrong-account key surfaces later as a plan
      # that would not build, which reads as a test failure rather than a
      # credentials problem.
      - name: API liveness check
        env:
          TEMPORAL_CLOUD_API_KEY: ${{ secrets.TEMPORAL_CLOUD_API_KEY }}
        run: scripts/check-api.sh

      - name: Init
        run: terraform init -backend=false

      # terraform test tears down what it created, including after a failed
      # assertion. A cancelled or crashed runner can still orphan a resource, so
      # check the account if this job does not finish cleanly.
      - name: Test
        env:
          TEMPORAL_CLOUD_API_KEY: ${{ secrets.TEMPORAL_CLOUD_API_KEY }}
        run: terraform test -verbose

      # Runs even when the tests fail, because that is exactly when something may
      # have been left behind.
      - name: Check for leftover users
        if: always()
        env:
          TEMPORAL_CLOUD_API_KEY: ${{ secrets.TEMPORAL_CLOUD_API_KEY }}
        run: scripts/check-orphans.sh
